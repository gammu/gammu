name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        args: ['']
        include:
        - args: -DENABLE_GETOPT=OFF
        - args: -DUSE_WCHAR_T=OFF
        # TODO: Compiler gcc / clang
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
      ARGS: ${{ matrix.args }}
    services:
      postgres:
        image: postgres@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_PASSWORD: smsd
          POSTGRES_USER: smsd
          POSTGRES_DB: smsd
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      mysql:
        image: mysql@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
        env:
          MYSQL_DATABASE: smsd
          MYSQL_USER: smsd
          MYSQL_PASSWORD: smsd
          MYSQL_ROOT_PASSWORD: smsd
        options: >-
          --health-cmd="mysqladmin --password=smsd ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
        - 3306:3306
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: apt
      run: |
        sudo apt-get update
        sudo apt-get install -y libbluetooth-dev libusb-1.0-0-dev libgudev-1.0-dev unixodbc-dev libdbi-dev libdbd-sqlite3 libdbd-mysql libdbd-pgsql cmake cmake-data
    - name: Prepare
      run: |
        mkdir _build
        cd _build
        ln -s ../codecov.yml .
    - name: cmake
      run: |
        cd _build
        #  -DCMAKE_C_COMPILER=$CC
        cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Continuous -DONLINE_TESTING=ON -DMYSQL_TESTING=on -DPSQL_TESTING=ON $ARGS
    - name: build
      run: make -C _build
    - name: test
      run: make -C _build test
    - name: coverage
      run: make -C _build gcov
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
  mssql-odbc:
    runs-on: ubuntu-24.04
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
      MSSQL_SA_PASSWORD: GammuODBC2026
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: GammuODBC2026
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GammuODBC2026 -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=12
        ports:
        - 1433:1433
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Microsoft ODBC tools
      run: |
        curl -sSL -o /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
        sudo dpkg -i /tmp/packages-microsoft-prod.deb
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y cmake cmake-data msodbcsql18 mssql-tools18 unixodbc-dev
    - name: Configure ODBC
      run: |
        sudo tee /etc/odbc.ini >/dev/null <<'EOF'
        [smsd-mssql]
        Driver = ODBC Driver 18 for SQL Server
        Server = tcp:127.0.0.1,1433
        Database = smsd
        Encrypt = yes
        TrustServerCertificate = yes
        EOF
    - name: Create database
      run: |
        /opt/mssql-tools18/bin/sqlcmd -C -b -S 127.0.0.1,1433 -U sa -P "$MSSQL_SA_PASSWORD" -Q "CREATE DATABASE smsd COLLATE Latin1_General_100_CI_AS_SC_UTF8"
    - name: Configure and build
      run: |
        cmake -S . -B _build-mssql \
          -DMSSQL_TESTING=ON \
          -DMSSQL_HOST=127.0.0.1,1433 \
          -DMSSQL_DATABASE=smsd \
          -DMSSQL_USER=sa \
          -DMSSQL_PASSWORD="$MSSQL_SA_PASSWORD" \
          -DMSSQL_ODBC_DSN=smsd-mssql
        cmake --build _build-mssql --parallel 2 --target gammu-smsd gammu-smsd-inject gammu-smsd-monitor
    - name: Test ODBC with Microsoft SQL Server
      run: ctest --test-dir _build-mssql --output-on-failure -R '^smsd-odbc-mssql$'
  windows:
    runs-on: windows-latest
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Start PostgreSQL on Windows
      run: |
        $pgService = Get-Service -Name postgresql*
        Set-Service -InputObject $pgService -Status running -StartupType automatic
        Start-Process -FilePath "$env:PGBIN\pg_isready" -Wait -PassThru
    - name: Create PostgreSQL user on Windows
      run: |
        & $env:PGBIN\psql --command="CREATE USER smsd PASSWORD 'smsd'" --command="\du"
    - name: Create PostgreSQL database
      run: |
        & $env:PGBIN\createdb --owner=smsd smsd
        $env:PGPASSWORD = 'smsd'
        & $env:PGBIN\psql --username=smsd --host=localhost --list smsd
    - name: Configure and build
      uses: ./.github/actions/windows-installer
      with:
        build-type: Release
        enable-testing: 'true'
    - name: test
      run: |
        cd _build
        ctest --output-on-failure --no-compress-output --dashboard ExperimentalTest --build-config Release
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
  macos:
    runs-on: macos-latest
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Start PostgreSQL on MacOS
      run: |
        brew install postgresql
        brew services start postgresql
        echo "Check PostgreSQL service is running"
        i=10
        COMMAND='pg_isready'
        while [ $i -gt 0 ]; do
            echo "Check PostgreSQL service status"
            eval $COMMAND && break
            ((i--))
            if [ $i == 0 ]; then
                echo "PostgreSQL service not ready, all attempts exhausted"
                exit 1
            fi
            echo "PostgreSQL service not ready, wait 10 more sec, attempts left: $i"
            sleep 10
        done
      # Homebrew creates an account with the same name as the installing user, but no password
    - name: Create PostgreSQL user
      run: |
        psql --command="CREATE USER smsd PASSWORD 'smsd'" --command="\du" postgres
    - name: Create PostgreSQL database
      run: |
        createdb --owner=smsd smsd
        PGPASSWORD=smsd psql --username=smsd --host=localhost --list smsd
    - name: Prepare
      run: |
        mkdir _build
        cd _build
        ln -s ../codecov.yml .
    - name: cmake
      run: |
        cd _build
        cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Continuous -DONLINE_TESTING=ON -DPSQL_TESTING=ON
    - name: build
      run: make -C _build
    - name: test
      run: make -C _build test
    - name: coverage
      run: make -C _build gcov
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
