name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        args: ['']
        include:
        - args: -DENABLE_GETOPT=OFF
        - args: -DUSE_WCHAR_T=OFF
        # TODO: Compiler gcc / clang
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
      ARGS: ${{ matrix.args }}
    services:
      postgres:
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: smsd
          POSTGRES_USER: smsd
          POSTGRES_DB: smsd
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
        - 5432:5432
      mysql:
        image: mysql@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
        env:
          MYSQL_DATABASE: smsd
          MYSQL_USER: smsd
          MYSQL_PASSWORD: smsd
          MYSQL_ROOT_PASSWORD: smsd
        options: >-
          --health-cmd="mysqladmin --password=smsd ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
        - 3306:3306
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: apt
      run: |
        sudo apt-get update
        sudo apt-get install -y libbluetooth-dev libusb-1.0-0-dev libgudev-1.0-dev unixodbc-dev libdbi-dev libdbd-sqlite3 libdbd-mysql libdbd-pgsql cmake cmake-data
    - name: Prepare
      run: |
        mkdir _build
        cd _build
        ln -s ../codecov.yml .
    - name: cmake
      run: |
        cd _build
        #  -DCMAKE_C_COMPILER=$CC
        cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Continuous -DONLINE_TESTING=ON -DMYSQL_TESTING=on -DPSQL_TESTING=ON $ARGS
    - name: build
      run: make -C _build
    - name: test
      run: make -C _build test
    - name: coverage
      run: make -C _build gcov
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
  mssql-odbc:
    runs-on: ubuntu-24.04
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
      MSSQL_SA_PASSWORD: GammuODBC2026
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: GammuODBC2026
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GammuODBC2026 -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=12
        ports:
        - 1433:1433
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Microsoft ODBC tools
      run: |
        curl -sSL -o /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
        sudo dpkg -i /tmp/packages-microsoft-prod.deb
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y cmake cmake-data msodbcsql18 mssql-tools18 unixodbc-dev
    - name: Configure ODBC
      run: |
        sudo tee /etc/odbc.ini >/dev/null <<'EOF'
        [smsd-mssql]
        Driver = ODBC Driver 18 for SQL Server
        Server = tcp:127.0.0.1,1433
        Database = smsd
        Encrypt = yes
        TrustServerCertificate = yes
        EOF
    - name: Create database
      run: |
        /opt/mssql-tools18/bin/sqlcmd -C -b -S 127.0.0.1,1433 -U sa -P "$MSSQL_SA_PASSWORD" -Q "CREATE DATABASE smsd COLLATE Latin1_General_100_CI_AS_SC_UTF8"
    - name: Configure and build
      run: |
        cmake -S . -B _build-mssql \
          -DMSSQL_TESTING=ON \
          -DMSSQL_HOST=127.0.0.1,1433 \
          -DMSSQL_DATABASE=smsd \
          -DMSSQL_USER=sa \
          -DMSSQL_PASSWORD="$MSSQL_SA_PASSWORD" \
          -DMSSQL_ODBC_DSN=smsd-mssql
        cmake --build _build-mssql --parallel 2 --target gammu-smsd gammu-smsd-inject gammu-smsd-monitor
    - name: Test ODBC with Microsoft SQL Server
      run: ctest --test-dir _build-mssql --output-on-failure -R '^smsd-odbc-mssql$'
  oracle-odbc:
    runs-on: ubuntu-24.04
    container:
      image: container-registry.oracle.com/os/oraclelinux:9@sha256:e0e83fa9c9d3f2da73fd515e1f11ae03c3bbe9d232bf830d323649b9ea6452a4
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
      ORACLE_PASSWORD: GammuOracle2026
    services:
      oracle:
        image: container-registry.oracle.com/database/free:latest-lite@sha256:cf540c3fa190d7cffad08c491652ac07fc70314e510f6b87890449517d565e94
        env:
          ORACLE_PWD: GammuOracle2026
        options: >-
          --shm-size=1g
          --health-cmd="/opt/oracle/checkDBStatus.sh"
          --health-interval=10s
          --health-timeout=10s
          --health-start-period=60s
          --health-retries=30
    steps:
    - name: Install build and Oracle ODBC tools
      run: |
        cat > /etc/yum.repos.d/oracle-instantclient.repo <<'EOF'
        [ol9_oracle_instantclient]
        name=Oracle Instant Client for Oracle Linux 9 ($basearch)
        baseurl=https://yum.oracle.com/repo/OracleLinux/OL9/oracle/instantclient/$basearch/
        gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-oracle
        gpgcheck=1
        enabled=1
        EOF
        dnf install -y --enablerepo=ol9_codeready_builder \
          cmake gcc git glib2-devel make unixODBC-devel \
          oracle-instantclient19.31-basic \
          oracle-instantclient19.31-odbc \
          oracle-instantclient19.31-sqlplus
        dnf clean all
        client_bin=$(dirname "$(rpm -ql oracle-instantclient19.31-sqlplus | grep '/sqlplus$')")
        client_lib=$(dirname "$(rpm -ql oracle-instantclient19.31-odbc | grep '/libsqora.so')")
        echo "$client_bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=$client_lib" >> "$GITHUB_ENV"
        echo "NLS_LANG=.AL32UTF8" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Configure Oracle ODBC
      run: |
        oracle_driver=$(rpm -ql oracle-instantclient19.31-odbc | grep '/libsqora.so')
        cat > /etc/odbcinst.ini <<EOF
        [Oracle]
        Description = Oracle Instant Client ODBC
        Driver = $oracle_driver
        EOF
        cat > /etc/odbc.ini <<'EOF'
        [smsd-oracle]
        Driver = Oracle
        ServerName = //oracle:1521/FREEPDB1
        EOF
    - name: Create database user
      run: |
        sqlplus -L -S "system/$ORACLE_PASSWORD@//oracle:1521/FREEPDB1" <<'EOF'
        WHENEVER SQLERROR EXIT SQL.SQLCODE
        CREATE USER smsd IDENTIFIED BY "GammuOracle2026";
        GRANT CREATE SESSION, CREATE TABLE, CREATE SEQUENCE, CREATE TRIGGER,
          UNLIMITED TABLESPACE TO smsd;
        EOF
    - name: Configure and build
      run: |
        cmake -S . -B _build-oracle \
          -DORACLE_TESTING=ON \
          -DORACLE_HOST=oracle:1521 \
          -DORACLE_SERVICE=FREEPDB1 \
          -DORACLE_USER=smsd \
          -DORACLE_PASSWORD="$ORACLE_PASSWORD" \
          -DORACLE_ODBC_DSN=smsd-oracle \
          -DWITH_BLUETOOTH=OFF \
          -DWITH_USB=OFF
        cmake --build _build-oracle --parallel 2 --target gammu-smsd gammu-smsd-inject gammu-smsd-monitor
    - name: Test ODBC with Oracle
      run: ctest --test-dir _build-oracle --output-on-failure --no-tests=error -R '^smsd-odbc-oracle$'
  windows:
    runs-on: windows-latest
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Start PostgreSQL on Windows
      run: |
        $pgService = Get-Service -Name postgresql*
        Set-Service -InputObject $pgService -Status running -StartupType automatic
        Start-Process -FilePath "$env:PGBIN\pg_isready" -Wait -PassThru
    - name: Create PostgreSQL user on Windows
      run: |
        & $env:PGBIN\psql --command="CREATE USER smsd PASSWORD 'smsd'" --command="\du"
    - name: Create PostgreSQL database
      run: |
        & $env:PGBIN\createdb --owner=smsd smsd
        $env:PGPASSWORD = 'smsd'
        & $env:PGBIN\psql --username=smsd --host=localhost --list smsd
    - name: Configure and build
      uses: ./.github/actions/windows-installer
      with:
        build-type: Release
        enable-testing: 'true'
    - name: test
      run: |
        cd _build
        ctest --output-on-failure --no-compress-output --dashboard ExperimentalTest --build-config Release
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
  macos:
    runs-on: macos-latest
    env:
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Start PostgreSQL on MacOS
      run: |
        brew install postgresql
        brew services start postgresql
        echo "Check PostgreSQL service is running"
        i=10
        COMMAND='pg_isready'
        while [ $i -gt 0 ]; do
            echo "Check PostgreSQL service status"
            eval $COMMAND && break
            ((i--))
            if [ $i == 0 ]; then
                echo "PostgreSQL service not ready, all attempts exhausted"
                exit 1
            fi
            echo "PostgreSQL service not ready, wait 10 more sec, attempts left: $i"
            sleep 10
        done
      # Homebrew creates an account with the same name as the installing user, but no password
    - name: Create PostgreSQL user
      run: |
        psql --command="CREATE USER smsd PASSWORD 'smsd'" --command="\du" postgres
    - name: Create PostgreSQL database
      run: |
        createdb --owner=smsd smsd
        PGPASSWORD=smsd psql --username=smsd --host=localhost --list smsd
    - name: Prepare
      run: |
        mkdir _build
        cd _build
        ln -s ../codecov.yml .
    - name: cmake
      run: |
        cd _build
        cmake .. -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Continuous -DONLINE_TESTING=ON -DPSQL_TESTING=ON
    - name: build
      run: make -C _build
    - name: test
      run: make -C _build test
    - name: coverage
      run: make -C _build gcov
    - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
