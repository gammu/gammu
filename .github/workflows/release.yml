name: Release

on:
  push:
    branches:
    - '**'
    tags:
    - '*'
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: Build source packages
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake

    - name: Create build directory
      run: mkdir _build

    - name: Configure CMake
      run: |
        cd _build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build source tarball
      run: |
        cd _build
        make package_source

    - name: List generated files
      run: |
        cd _build
        ls -lh Gammu-*

    - name: Upload source tarball
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: source
        path: _build/Gammu-*

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build Windows installer
      uses: ./.github/actions/windows-installer
      with:
        build-type: Release
        enable-testing: 'false'

    - name: List generated files
      shell: pwsh
      run: |
        cd _build
        Get-ChildItem -Filter "Gammu-*.exe"

    - name: Upload Windows installer
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-installer
        path: _build/Gammu-*.exe

  windows-installer-minimal:
    name: Build Windows minimal installer
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build Windows minimal installer
      uses: ./.github/actions/windows-installer
      with:
        build-type: Release
        enable-testing: 'false'
        minimal-build: 'true'

    - name: List generated files
      shell: pwsh
      run: |
        cd _build
        Get-ChildItem -Filter "Gammu-*.exe"

    - name: Upload Windows minimal installer
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-installer-minimal
        path: _build/Gammu-*.exe

  release:
    name: Create GitHub Release
    needs: [source, windows-installer, windows-installer-minimal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Check out release tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts

    - name: List downloaded artifacts
      run: |
        ls artifacts/source/* artifacts/windows-installer/* artifacts/windows-installer-minimal/*

    - name: Prepare release notes
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: |
        awk -v version="$RELEASE_VERSION" '
          /^[0-9]{8} - / {
            if (found) {
              exit
            }
            if (substr($0, 12) == version) {
              found = 1
            }
            next
          }
          found {
            line = $0
            if (sub(/^\[[^]]\] /, "", line)) {
              entries++
            } else if (line ~ /^      /) {
              sub(/^    /, "", line)
            }
            print line
          }
          END {
            if (!found) {
              print "No ChangeLog section found for " version > "/dev/stderr"
              exit 1
            }
            if (!entries) {
              print "No ChangeLog entries found for " version > "/dev/stderr"
              exit 1
            }
          }
        ' ChangeLog > release-notes.md

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        body_path: release-notes.md
        files: |
          artifacts/source/*
          artifacts/windows-installer/*
          artifacts/windows-installer-minimal/*
        draft: false
        prerelease: false
